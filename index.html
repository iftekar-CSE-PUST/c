<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Gesture Shooter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: #000;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading h2 {
      color: #fff;
      margin-top: 20px;
      font-size: 24px;
    }
    #loading p {
      color: rgba(255,255,255,0.8);
      margin-top: 10px;
      font-size: 14px;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }
    #crosshair {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #0f0;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(0,255,0,0.6);
      transition: all 0.1s ease-out;
      z-index: 5;
    }
    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: #0f0;
      box-shadow: 0 0 10px rgba(0,255,0,0.8);
    }
    #crosshair::before {
      width: 2px;
      height: 20px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #crosshair::after {
      width: 20px;
      height: 2px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .vfx-text {
      position: absolute;
      font-size: 36px;
      font-weight: bold;
      pointer-events: none;
      z-index: 15;
      animation: vfxFloat 1s ease-out forwards;
    }
    .vfx-hit {
      color: #0f0;
      text-shadow: 0 0 10px #0f0, 2px 2px 4px rgba(0,0,0,0.8);
    }
    .vfx-miss {
      color: #f00;
      text-shadow: 0 0 10px #f00, 2px 2px 4px rgba(0,0,0,0.8);
    }
    @keyframes vfxFloat {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <h2>Loading AR Shooter</h2>
    <p>Initializing hand tracking model...</p>
  </div>

  <div id="cameraPrompt" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000;">
    <h1 style="color: #fff; font-size: 36px; margin-bottom: 20px;">📷 AR Gesture Shooter</h1>
    <p style="color: rgba(255,255,255,0.8); font-size: 18px; margin-bottom: 30px; text-align: center; max-width: 500px;">
      This game uses your camera to track hand gestures.<br>
      Make a pistol gesture to aim and shoot flying discs!
    </p>
    <button id="startBtn" style="padding: 15px 40px; font-size: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(102,126,234,0.4); transition: transform 0.2s;">
      Allow Camera & Start
    </button>
  </div>
  
  <div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas3d"></canvas>
    <div id="crosshair"></div>
    <div id="ui">
      Score: <span id="score">0</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>

  <script>
    // Audio context for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playHitSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 800;
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playMissSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 200;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Three.js setup
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.position.z = 5;

    // Game state
    const gameState = {
      score: 0,
      discs: [],
      aimPos: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
      lastShot: 0,
      isPistolGesture: false,
      wasThumbDown: false
    };

    // Create flying disc
    function createDisc() {
      const geometry = new THREE.CircleGeometry(0.3, 32);
      const material = new THREE.MeshBasicMaterial({ 
        color: Math.random() * 0xffffff,
        side: THREE.DoubleSide
      });
      const disc = new THREE.Mesh(geometry, material);
      
      // Spawn from random edge
      const edge = Math.floor(Math.random() * 4);
      const offset = (Math.random() - 0.5) * 10;
      
      if (edge === 0) { // top
        disc.position.set(offset, 6, 0);
        disc.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.02, -0.03, 0);
      } else if (edge === 1) { // right
        disc.position.set(8, offset, 0);
        disc.velocity = new THREE.Vector3(-0.03, (Math.random() - 0.5) * 0.02, 0);
      } else if (edge === 2) { // bottom
        disc.position.set(offset, -6, 0);
        disc.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.02, 0.03, 0);
      } else { // left
        disc.position.set(-8, offset, 0);
        disc.velocity = new THREE.Vector3(0.03, (Math.random() - 0.5) * 0.02, 0);
      }
      
      disc.rotation.z = Math.random() * Math.PI * 2;
      disc.rotationSpeed = (Math.random() - 0.5) * 0.1;
      
      scene.add(disc);
      gameState.discs.push(disc);
    }

    // Initialize discs
    for (let i = 0; i < 4; i++) {
      createDisc();
    }

    // Laser line
    const laserMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
    const laserGeometry = new THREE.BufferGeometry();
    const laserLine = new THREE.Line(laserGeometry, laserMaterial);
    scene.add(laserLine);

    // Update laser line
    function updateLaser(show, start, end) {
      if (show && start && end) {
        const points = [start, end];
        laserLine.geometry.setFromPoints(points);
        laserLine.visible = true;
      } else {
        laserLine.visible = false;
      }
    }

    // Screen to world coordinates
    function screenToWorld(x, y) {
      const vec = new THREE.Vector3();
      vec.x = (x / window.innerWidth) * 2 - 1;
      vec.y = -(y / window.innerHeight) * 2 + 1;
      vec.z = 0.5;
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      const pos = camera.position.clone().add(dir.multiplyScalar(distance));
      return pos;
    }

    // World to screen coordinates
    function worldToScreen(worldPos) {
      const vector = worldPos.clone();
      vector.project(camera);
      return {
        x: (vector.x + 1) / 2 * window.innerWidth,
        y: -(vector.y - 1) / 2 * window.innerHeight
      };
    }

    // Magnetic aim assist
    function applyAimAssist(x, y) {
      let closestDist = Infinity;
      let closestPos = { x, y };
      const assistRadius = 150;
      
      gameState.discs.forEach(disc => {
        const screenPos = worldToScreen(disc.position);
        const dx = screenPos.x - x;
        const dy = screenPos.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < assistRadius && dist < closestDist) {
          closestDist = dist;
          const strength = 1 - (dist / assistRadius);
          closestPos.x = x + dx * strength * 0.5;
          closestPos.y = y + dy * strength * 0.5;
        }
      });
      
      return closestPos;
    }

    // Show VFX text
    function showVFX(text, x, y, isHit) {
      const vfx = document.createElement('div');
      vfx.className = `vfx-text ${isHit ? 'vfx-hit' : 'vfx-miss'}`;
      vfx.textContent = text;
      vfx.style.left = x + 'px';
      vfx.style.top = y + 'px';
      document.body.appendChild(vfx);
      setTimeout(() => vfx.remove(), 1000);
    }

    // Shoot
    function shoot() {
      const now = Date.now();
      if (now - gameState.lastShot < 300) return;
      gameState.lastShot = now;
      
      const worldPos = screenToWorld(gameState.aimPos.x, gameState.aimPos.y);
      let hit = false;
      
      gameState.discs.forEach((disc, idx) => {
        const dist = disc.position.distanceTo(worldPos);
        if (dist < 0.5) {
          hit = true;
          scene.remove(disc);
          gameState.discs.splice(idx, 1);
          gameState.score += 10;
          document.getElementById('score').textContent = gameState.score;
          playHitSound();
          showVFX('HIT', gameState.aimPos.x, gameState.aimPos.y, true);
          createDisc(); // Immediately spawn replacement
        }
      });
      
      if (!hit) {
        playMissSound();
        showVFX('MISS', gameState.aimPos.x, gameState.aimPos.y, false);
      }
    }

    // Hand tracking
    const video = document.getElementById('video');
    const crosshair = document.getElementById('crosshair');
    let handsReady = false;

    let hands;
    
    function initializeHands() {
      hands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults(onHandResults);
      return hands.initialize();
    }

    // Process hand landmarks with crash protection
    function onHandResults(results) {
      try {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          
          // Index finger tip (8), thumb tip (4), thumb IP (3)
          const indexTip = landmarks[8];
          const thumbTip = landmarks[4];
          const thumbIP = landmarks[3];
          
          // Pistol gesture: index extended, thumb up/down for trigger
          const indexExtended = landmarks[8].y < landmarks[6].y;
          const middleFolded = landmarks[12].y > landmarks[10].y;
          const ringFolded = landmarks[16].y > landmarks[14].y;
          const pinkyFolded = landmarks[20].y > landmarks[18].y;
          
          gameState.isPistolGesture = indexExtended && middleFolded && ringFolded && pinkyFolded;
          
          if (gameState.isPistolGesture) {
            // Aim with index finger
            const x = (1 - indexTip.x) * window.innerWidth;
            const y = indexTip.y * window.innerHeight;
            
            // Apply magnetic aim assist
            const assisted = applyAimAssist(x, y);
            gameState.aimPos.x = assisted.x;
            gameState.aimPos.y = assisted.y;
            
            crosshair.style.left = gameState.aimPos.x + 'px';
            crosshair.style.top = gameState.aimPos.y + 'px';
            crosshair.style.display = 'block';
            
            // Trigger detection: thumb moves down
            const thumbDown = thumbTip.y > thumbIP.y + 0.05;
            if (thumbDown && !gameState.wasThumbDown) {
              shoot();
            }
            gameState.wasThumbDown = thumbDown;
            
            // Update laser
            const startWorld = camera.position.clone();
            const endWorld = screenToWorld(gameState.aimPos.x, gameState.aimPos.y);
            updateLaser(true, startWorld, endWorld);
          } else {
            crosshair.style.display = 'none';
            gameState.wasThumbDown = false;
            updateLaser(false);
          }
        } else {
          crosshair.style.display = 'none';
          gameState.wasThumbDown = false;
          updateLaser(false);
        }
      } catch (error) {
        console.error('Hand tracking error:', error);
      }
    }

    // Start camera with throttled detection
    let cameraRequested = false;
    
    async function startCamera() {
      if (cameraRequested) return;
      cameraRequested = true;
      
      try {
        document.getElementById('cameraPrompt').style.display = 'none';
        document.getElementById('loading').style.display = 'flex';
        
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 1280, height: 720 } 
        });
        video.srcObject = stream;
        
        await new Promise(resolve => {
          video.onloadedmetadata = resolve;
        });
        
        // Wait for hands model to load
        await initializeHands();
        handsReady = true;
        
        // Hide loading screen
        document.getElementById('loading').classList.add('hidden');
        
        // Throttled detection loop (20 FPS for AI, 60 FPS for rendering)
        let lastDetection = 0;
        const detectionInterval = 50; // 20 FPS
        
        async function detectHands() {
          const now = Date.now();
          if (handsReady && now - lastDetection > detectionInterval) {
            lastDetection = now;
            try {
              await hands.send({ image: video });
            } catch (error) {
              console.error('Detection error:', error);
            }
          }
          requestAnimationFrame(detectHands);
        }
        detectHands();
        
      } catch (error) {
        console.error('Camera error:', error);
        cameraRequested = false;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('cameraPrompt').innerHTML = `
          <h1 style="color: #fff; font-size: 36px; margin-bottom: 20px;">⚠️ Camera Access Needed</h1>
          <p style="color: rgba(255,255,255,0.8); font-size: 18px; margin-bottom: 30px; text-align: center; max-width: 500px;">
            Camera permission was denied or is unavailable.<br><br>
            <strong>To fix this:</strong><br>
            1. Click the camera icon 🎥 in your browser's address bar<br>
            2. Select "Allow" for camera access<br>
            3. Click the button below to try again
          </p>
          <button onclick="location.reload()" style="padding: 15px 40px; font-size: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 30px; cursor: pointer; font-weight: bold;">
            Try Again
          </button>
        `;
        document.getElementById('cameraPrompt').style.display = 'flex';
      }
    }

    // Animation loop (60 FPS)
    function animate() {
      requestAnimationFrame(animate);
      
      // Update discs
      gameState.discs.forEach((disc, idx) => {
        disc.position.add(disc.velocity);
        disc.rotation.z += disc.rotationSpeed;
        
        // Remove if too far from center
        if (Math.abs(disc.position.x) > 10 || Math.abs(disc.position.y) > 10) {
          scene.remove(disc);
          gameState.discs.splice(idx, 1);
          createDisc(); // Immediately spawn replacement
        }
      });
      
      renderer.render(scene, camera);
    }

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start everything
    document.getElementById('startBtn').addEventListener('click', startCamera);
    animate();
  </script>
</body>
</html>
