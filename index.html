<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Gesture Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        #score-board {
            position: absolute; top: 20px; left: 20px;
            color: #0ff; font-size: 24px; font-weight: bold; text-shadow: 0 0 5px #0ff;
        }

        /* Loading Screen */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            pointer-events: auto;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top: 5px solid #0f0; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #start-btn {
            padding: 15px 40px; font-size: 20px; background: #0f0; border: none;
            color: #000; cursor: pointer; display: none; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
        }
        #start-btn:hover { background: #fff; box-shadow: 0 0 15px #0f0; }

        /* Floating Text */
        .float-text {
            position: absolute; font-weight: bold; font-size: 20px;
            animation: floatUp 1s forwards; pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        #status-msg { margin-top: 10px; color: #888; font-size: 14px; }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands (Pinned Version for Stability) -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js"></script>
</head>
<body>

    <!-- Structure -->
    <div id="loader">
        <div class="spinner"></div>
        <h2 id="load-text">INITIALIZING AI...</h2>
        <div id="status-msg">Downloading models (approx 10MB)...</div>
        <button id="start-btn">START OPERATION</button>
    </div>

    <div id="ui-layer">
        <div id="score-board">SCORE: 0</div>
    </div>

    <!-- Hidden Video for Processing -->
    <video id="input-video" style="display:none;" playsinline></video>

<script>
/**
 * CONFIGURATION & STATE
 */
const CONFIG = {
    AI_THROTTLE_MS: 80, // Limit AI detection to ~12fps to save CPU for rendering
    MAGNET_RADIUS: 80,  // Pixel radius for aim assist
    DISC_count: 4,
    DISC_SPEED: 0.05
};

const state = {
    score: 0,
    isPlaying: false,
    hand: null, // { x, y, isShooting }
    lastShotTime: 0,
    width: window.innerWidth,
    height: window.innerHeight
};

// Simple Audio Synth to avoid external assets
const AudioSys = {
    ctx: null,
    init: () => {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        AudioSys.ctx = new AudioContext();
    },
    playShoot: () => {
        if (!AudioSys.ctx) return;
        const osc = AudioSys.ctx.createOscillator();
        const gain = AudioSys.ctx.createGain();
        osc.connect(gain);
        gain.connect(AudioSys.ctx.destination);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, AudioSys.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, AudioSys.ctx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.3, AudioSys.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, AudioSys.ctx.currentTime + 0.15);
        
        osc.start();
        osc.stop(AudioSys.ctx.currentTime + 0.2);
    },
    playHit: () => {
        if (!AudioSys.ctx) return;
        const osc = AudioSys.ctx.createOscillator();
        const gain = AudioSys.ctx.createGain();
        osc.connect(gain);
        gain.connect(AudioSys.ctx.destination);
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, AudioSys.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, AudioSys.ctx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0.3, AudioSys.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, AudioSys.ctx.currentTime + 0.1);
        
        osc.start();
        osc.stop(AudioSys.ctx.currentTime + 0.15);
    }
};

/**
 * THREE.JS SCENE SETUP
 */
const scene = new THREE.Scene();
// 2D orthographic camera for background video, 3D perspective for game objects
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance cap
document.body.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

// Group to hold enemies
const enemyGroup = new THREE.Group();
scene.add(enemyGroup);

// Laser Line
const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-10)]);
const laserMat = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.6 });
const laserLine = new THREE.Line(laserGeo, laserMat);
// We attach laser to a "hand group" that moves in 3D space based on screen pos
const handMarker = new THREE.Group();
handMarker.add(laserLine);
scene.add(handMarker);

// Crosshair Mesh (Simple Ring)
const crosshairGeo = new THREE.RingGeometry(0.15, 0.18, 32);
const crosshairMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
const crosshair = new THREE.Mesh(crosshairGeo, crosshairMat);
scene.add(crosshair);

/**
 * GAME LOGIC
 */

// Disc Management
const enemies = [];

function spawnEnemy() {
    const geometry = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
    geometry.rotateX(Math.PI / 2); // Face camera
    const material = new THREE.MeshPhongMaterial({ color: 0xff0055, shininess: 100 });
    const disc = new THREE.Mesh(geometry, material);

    // Spawn at random edge
    const edge = Math.floor(Math.random() * 4);
    const dist = 7; // distance from center
    let x, y;
    
    // Rudimentary layout logic
    if (edge === 0) { x = -dist; y = (Math.random()-0.5)*6; } // Left
    else if (edge === 1) { x = dist; y = (Math.random()-0.5)*6; } // Right
    else if (edge === 2) { x = (Math.random()-0.5)*10; y = dist; } // Top
    else { x = (Math.random()-0.5)*10; y = -dist; } // Bottom

    disc.position.set(x, y, 0); // Z is 0 (enemies move on a plane mostly)
    
    // Metadata for movement
    disc.userData = {
        velocity: new THREE.Vector3(-x, -y, 0).normalize().multiplyScalar(CONFIG.DISC_SPEED + Math.random() * 0.03)
    };
    
    enemyGroup.add(disc);
    enemies.push(disc);
}

function updateEnemies() {
    // Keep 4 enemies
    while (enemies.length < CONFIG.DISC_count) {
        spawnEnemy();
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.position.add(e.userData.velocity);
        e.rotation.z += 0.1; // Spin effect

        // If it crosses center too much, respawn (simulate player getting hit or passing by)
        if (e.position.length() < 0.5) {
             // Reset to edge
             enemyGroup.remove(e);
             enemies.splice(i, 1);
        }
    }
}

// Visual Effects
function showFloatingText(text, x, y, color) {
    const div = document.createElement('div');
    div.className = 'float-text';
    div.innerText = text;
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.style.color = color;
    document.getElementById('ui-layer').appendChild(div);
    setTimeout(() => div.remove(), 1000);
}

// Convert 3D position to Screen Coordinates
function toScreenPosition(obj, camera) {
    const vector = new THREE.Vector3();
    obj.updateMatrixWorld(); // force update
    vector.setFromMatrixPosition(obj.matrixWorld);
    vector.project(camera);
    
    const x = (vector.x * .5 + .5) * window.innerWidth;
    const y = (-(vector.y * .5) + .5) * window.innerHeight;
    return { x, y };
}

/**
 * MEDIAPIPE HANDS SETUP
 */
const videoElement = document.getElementById('input-video');
let hands;

async function setupAI() {
    // Use pinned unpkg version to avoid wasm location errors
    const MP_BASE = "https://unpkg.com/@mediapipe/hands@0.4.1646424915/";
    
    hands = new Hands({locateFile: (file) => {
        return `${MP_BASE}${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0, // 0 is fastest, 1 is medium
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onHandsResults);

    // Setup Video
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
        videoElement.srcObject = stream;
        await new Promise(resolve => videoElement.onloadedmetadata = resolve);
        videoElement.play();
        
        // Setup Video Texture for Background
        const videoTexture = new THREE.VideoTexture(videoElement);
        scene.background = videoTexture;

        // Ready to start
        document.getElementById('load-text').innerText = "SYSTEM READY";
        document.getElementById('status-msg').innerText = "Make a pistol gesture to play";
        document.getElementById('spinner').style.display = "none";
        document.getElementById('start-btn').style.display = "block";

    } catch (e) {
        document.getElementById('status-msg').innerText = "Error: Camera access denied or not supported.";
        console.error(e);
    }
}

// Process AI Results
function onHandsResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const marks = results.multiHandLandmarks[0];
        
        // 8: Index Tip, 4: Thumb Tip, 6: Index PIP (Knuckle)
        const indexTip = marks[8];
        const thumbTip = marks[4];
        const indexPip = marks[6]; 

        // 1. Calculate Cursor Position (Mirror X for natural feel)
        const rawX = (1 - indexTip.x) * window.innerWidth;
        const rawY = indexTip.y * window.innerHeight;

        // 2. Gesture Logic: Pistol Trigger
        // Calculate distance between thumb tip and index knuckle
        // We normalize distance based on hand size (wrist to middle finger mcp)
        const handSize = Math.hypot(marks[0].x - marks[9].x, marks[0].y - marks[9].y);
        const triggerDist = Math.hypot(thumbTip.x - indexPip.x, thumbTip.y - indexPip.y);
        
        // Threshold: If thumb is close to knuckle, it's a "press"
        const isPinching = (triggerDist / handSize) < 0.35; // 0.3 is rough heuristic

        state.hand = {
            x: rawX,
            y: rawY,
            isShooting: isPinching
        };
    } else {
        state.hand = null;
    }
}

/**
 * GAME LOOP
 */
let lastAITime = 0;
// Current smoothed cursor position
let cursorX = window.innerWidth / 2;
let cursorY = window.innerHeight / 2;

function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    // 1. AI Throttling (Protection against Main Thread blocking)
    if (state.isPlaying && (timestamp - lastAITime > CONFIG.AI_THROTTLE_MS)) {
        try {
            if (videoElement.readyState >= 2) {
                hands.send(videoElement);
            }
        } catch (e) {
            console.warn("AI Frame Dropped", e);
        }
        lastAITime = timestamp;
    }

    // 2. Update Gameplay Logic
    updateEnemies();

    // 3. Aim Assist & Cursor Logic
    if (state.hand) {
        let targetX = state.hand.x;
        let targetY = state.hand.y;
        let isMagnetized = false;

        // Magnetic Aim Assist
        let closestDist = 9999;
        let closestEnemy = null;

        enemies.forEach(enemy => {
            const screenPos = toScreenPosition(enemy, camera);
            const dist = Math.hypot(screenPos.x - targetX, screenPos.y - targetY);
            
            if (dist < CONFIG.MAGNET_RADIUS && dist < closestDist) {
                closestDist = dist;
                closestEnemy = enemy;
            }
        });

        // Snap to target if within range
        if (closestEnemy) {
            const snapPos = toScreenPosition(closestEnemy, camera);
            // Lerp strictly towards the enemy
            targetX = targetX + (snapPos.x - targetX) * 0.4;
            targetY = targetY + (snapPos.y - targetY) * 0.4;
            isMagnetized = true;
        }

        // Smooth cursor movement
        cursorX += (targetX - cursorX) * 0.2;
        cursorY += (targetY - cursorY) * 0.2;

        // Update 3D Crosshair Position
        // Unproject 2D screen to 3D world at a specific depth
        const vec = new THREE.Vector3();
        vec.set(
            (cursorX / window.innerWidth) * 2 - 1,
            -(cursorY / window.innerHeight) * 2 + 1,
            0.5 );
        
        vec.unproject(camera);
        vec.sub(camera.position).normalize();
        const distance = 4; // Distance from camera to place crosshair
        const pos = camera.position.clone().add(vec.multiplyScalar(distance));
        
        crosshair.position.copy(pos);
        crosshair.lookAt(camera.position); // Face camera
        crosshair.material.color.setHex(isMagnetized ? 0xff0000 : 0x00ff00);

        // Update Laser
        // Laser starts from bottom right/left corner (simulate holding gun) or just below cursor
        // For AR, let's make it look like it comes from the screen bottom towards the target
        const handStart = new THREE.Vector3(
             (state.hand.x / window.innerWidth) * 2 - 1, // Normalized X
             -1, // Bottom of screen
             -1  // Near plane
        ).unproject(camera);
        
        // Actually, simple laser: from camera z-offset to cursor pos
        // But let's just make the laser line point from the cursor z+1 into the screen
        const laserStart = pos.clone().add(new THREE.Vector3(0, -0.5, 1)); // Simulate hand position roughly
        
        const positions = laserLine.geometry.attributes.position.array;
        // Point A (Near hand)
        positions[0] = laserStart.x; positions[1] = laserStart.y; positions[2] = laserStart.z;
        // Point B (Target)
        positions[3] = pos.x; positions[4] = pos.y; positions[5] = pos.z;
        laserLine.geometry.attributes.position.needsUpdate = true;


        // SHOOTING LOGIC
        // We use a cooldown to prevent machine-gunning
        if (state.hand.isShooting && (timestamp - state.lastShotTime > 300)) {
            state.lastShotTime = timestamp;
            AudioSys.playShoot();
            
            // Check Hit
            if (closestEnemy && isMagnetized) {
                // HIT!
                AudioSys.playHit();
                showFloatingText("HIT!", cursorX, cursorY - 50, "#0f0");
                
                // Remove Enemy
                const idx = enemies.indexOf(closestEnemy);
                if (idx > -1) {
                    enemyGroup.remove(closestEnemy);
                    enemies.splice(idx, 1);
                    state.score += 100;
                    document.getElementById('score-board').innerText = "SCORE: " + state.score;
                }
            } else {
                // MISS
                showFloatingText("MISS", cursorX, cursorY - 50, "#fff");
            }
        }
    }

    renderer.render(scene, camera);
}

/**
 * INITIALIZATION HANDLERS
 */
document.getElementById('start-btn').addEventListener('click', () => {
    AudioSys.init();
    document.getElementById('loader').style.display = 'none';
    state.isPlaying = true;
    
    // Start loop
    requestAnimationFrame(gameLoop);
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Bootstrap
setupAI();

</script>
</body>
</html>
