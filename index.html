<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Gesture Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; transform: scaleX(-1); /* Mirror view */ }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        #score-board {
            position: absolute; top: 20px; left: 20px;
            color: #0ff; font-size: 24px; font-weight: bold; text-shadow: 0 0 5px #0ff;
        }

        /* Loading / Error Screen */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            pointer-events: auto; text-align: center; padding: 20px;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top: 5px solid #0f0; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #start-btn {
            padding: 15px 40px; font-size: 20px; background: #0f0; border: none;
            color: #000; cursor: pointer; display: none; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; margin-top: 20px;
        }
        #start-btn:hover { background: #fff; box-shadow: 0 0 15px #0f0; }

        .error-box {
            border: 2px solid red; background: rgba(50, 0, 0, 0.9);
            padding: 20px; display: none; max-width: 600px;
        }

        /* Floating Text */
        .float-text {
            position: absolute; font-weight: bold; font-size: 20px;
            animation: floatUp 0.8s forwards; pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        #status-msg { margin-top: 10px; color: #888; font-size: 14px; max-width: 80%; }
        
        /* Debug video hidden */
        #input-video { display: none; }
    </style>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands (Version Locked for Stability) -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js"></script>
</head>
<body>

    <!-- Loading / UI -->
    <div id="loader">
        <div id="error-display" class="error-box">
            <h3 style="color:red">CAMERA ERROR</h3>
            <p id="error-text"></p>
            <p><strong>FIX:</strong> Use HTTPS or run a local server (localhost).<br>Do not open as file://</p>
        </div>

        <div id="loading-content">
            <div class="spinner" id="spinner"></div>
            <h2 id="load-text">INITIALIZING SYSTEM...</h2>
            <div id="status-msg">Check camera permissions...</div>
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="score-board">SCORE: 0</div>
    </div>

    <!-- Hidden Video Element -->
    <video id="input-video" playsinline webkit-playsinline></video>

<script>
/**
 * 1. SYSTEM CHECKS & CONFIG
 */
const CONFIG = {
    AI_THROTTLE_MS: 100, // Process AI every 100ms
    MAGNET_RADIUS: 100,
    DISC_COUNT: 4,
    DISC_SPEED: 0.05
};

// Check for file protocol immediately
if (window.location.protocol === 'file:') {
    showError("Browser Security Block: Camera cannot be accessed from a local file. Please run this file via a local server (e.g., Python 'http.server' or VSCode Live Server).");
    throw new Error("File protocol detected");
}

function showError(msg) {
    document.getElementById('loading-content').style.display = 'none';
    const box = document.getElementById('error-display');
    box.style.display = 'block';
    document.getElementById('error-text').innerText = msg;
}

const state = {
    score: 0,
    isPlaying: false,
    hand: null, 
    lastShotTime: 0,
    width: window.innerWidth,
    height: window.innerHeight
};

/**
 * 2. AUDIO SYSTEM
 */
const AudioSys = {
    ctx: null,
    init: () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) AudioSys.ctx = new AudioContext();
    },
    playTone: (freq, type, duration) => {
        if (!AudioSys.ctx) return;
        const osc = AudioSys.ctx.createOscillator();
        const gain = AudioSys.ctx.createGain();
        osc.connect(gain);
        gain.connect(AudioSys.ctx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, AudioSys.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, AudioSys.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, AudioSys.ctx.currentTime + duration);
        osc.start();
        osc.stop(AudioSys.ctx.currentTime + duration);
    },
    shoot: () => AudioSys.playTone(600, 'sawtooth', 0.15),
    hit: () => AudioSys.playTone(150, 'square', 0.1)
};

/**
 * 3. THREE.JS SCENE
 */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

// IMPORTANT: Mirror the camera container to match the CSS mirrored canvas
const cameraGroup = new THREE.Group();
cameraGroup.add(camera);
scene.add(cameraGroup);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

// Enemies
const enemyGroup = new THREE.Group();
scene.add(enemyGroup);
const enemies = [];

// Crosshair
const crosshair = new THREE.Mesh(
    new THREE.RingGeometry(0.2, 0.25, 32),
    new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
);
scene.add(crosshair);

// Laser
const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
const laserLine = new THREE.Line(laserGeo, new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 }));
scene.add(laserLine);

/**
 * 4. GAME OBJECT LOGIC
 */
function spawnEnemy() {
    // 3D Disc
    const geometry = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
    geometry.rotateX(Math.PI / 2);
    const material = new THREE.MeshPhongMaterial({ color: 0xff0055 });
    const disc = new THREE.Mesh(geometry, material);

    // Random Spawn Logic
    const angle = Math.random() * Math.PI * 2;
    const radius = 8;
    disc.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
    
    // Move towards center
    const velocity = new THREE.Vector3().subVectors(new THREE.Vector3(0,0,0), disc.position).normalize().multiplyScalar(CONFIG.DISC_SPEED);
    disc.userData = { velocity: velocity };
    
    enemyGroup.add(disc);
    enemies.push(disc);
}

function updateGameObjects() {
    // Spawn
    while (enemies.length < CONFIG.DISC_COUNT) spawnEnemy();

    // Move
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.position.add(e.userData.velocity);
        e.rotation.z += 0.1;
        
        // Remove if too close (missed player)
        if (e.position.length() < 0.5) {
            enemyGroup.remove(e);
            enemies.splice(i, 1);
        }
    }
}

function createFloatingText(text, x, y, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    // Handle the CSS mirror effect by inverting calculation if needed, 
    // but typically UI overlays are standard DOM.
    // Since canvas is mirrored, x needs to be flipped for UI to match visual
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    document.getElementById('ui-layer').appendChild(el);
    setTimeout(() => el.remove(), 800);
}

// Convert World 3D to Screen 2D
function toScreenPos(obj) {
    const vec = new THREE.Vector3();
    obj.updateMatrixWorld();
    vec.setFromMatrixPosition(obj.matrixWorld);
    vec.project(camera);
    
    // Standard normalized coords
    let x = (vec.x * 0.5 + 0.5) * window.innerWidth;
    let y = (-(vec.y * 0.5) + 0.5) * window.innerHeight;
    
    // IMPORTANT: Because we mirrored the canvas via CSS (transform: scaleX(-1)),
    // the visual left is actual right. We must flip X logic for magnet calculations.
    // However, to keep math simple, we will flip the input hand coordinates to match the world instead.
    return { x, y }; 
}

/**
 * 5. CAMERA & AI SETUP
 */
const videoElement = document.getElementById('input-video');
let hands;

async function initCamera() {
    document.getElementById('status-msg').innerText = "Requesting Camera Access...";
    
    // Try High Res, fall back to basic
    const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } };
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        
        return new Promise((resolve) => {
            videoElement.onloadedmetadata = () => {
                videoElement.play();
                // Create Video Background
                const videoTexture = new THREE.VideoTexture(videoElement);
                // Fix texture color space
                videoTexture.encoding = THREE.sRGBEncoding; 
                scene.background = videoTexture;
                resolve(true);
            };
        });
    } catch (err) {
        console.error(err);
        showError("Camera Access Denied. Please allow camera permissions and reload. Ensure you are on HTTPS or Localhost.");
        return false;
    }
}

async function initAI() {
    document.getElementById('status-msg').innerText = "Loading AI Model (approx 10MB)...";
    
    try {
        hands = new Hands({locateFile: (file) => {
            return `https://unpkg.com/@mediapipe/hands@0.4.1646424915/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onAIResults);
        
        // Wait for first frame to ensure it loaded
        await hands.send({image: videoElement}); 
        
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('load-text').innerText = "SYSTEM READY";
        document.getElementById('status-msg').innerText = "";
        document.getElementById('start-btn').style.display = 'inline-block';
        
    } catch (e) {
        showError("AI Model Failed to Load. Check internet connection.");
    }
}

function onAIResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const idxTip = lm[8];
        const thumbTip = lm[4];
        const idxPip = lm[6]; // Index finger knuckle
        
        // Map 0..1 to Screen Pixels
        // Note: Mediapipe X is 0 (left) to 1 (right).
        // Since we mirrored the canvas with CSS, we want the hand logic to behave "mirrored" too visually.
        // Actually, easiest way: Raw x is (1 - x) to flip coordinate system to match mirrored CSS.
        let rawX = (1 - idxTip.x) * window.innerWidth; 
        let rawY = idxTip.y * window.innerHeight;

        // Gesture Detection: Distance between Thumb Tip and Index Knuckle (PIP)
        // Normalize against hand size (Wrist to Middle Finger Root)
        const handSize = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
        const triggerDist = Math.hypot(thumbTip.x - idxPip.x, thumbTip.y - idxPip.y);
        const isShooting = (triggerDist / handSize) < 0.3; // Threshold

        state.hand = { x: rawX, y: rawY, isShooting };
    } else {
        state.hand = null;
    }
}

/**
 * 6. GAME LOOP
 */
let lastAITime = 0;
let cursorX = window.innerWidth/2, cursorY = window.innerHeight/2;

function loop(time) {
    requestAnimationFrame(loop);
    
    if (!state.isPlaying) return;

    // AI Throttling
    if (time - lastAITime > CONFIG.AI_THROTTLE_MS) {
        if (videoElement.readyState === 4) {
            hands.send({image: videoElement}).catch(e => {}); // Silent catch for frame drops
        }
        lastAITime = time;
    }

    updateGameObjects();

    // Aim Assist & Rendering
    if (state.hand) {
        // Smoothing
        let targetX = state.hand.x;
        let targetY = state.hand.y;
        
        // Magnetism
        let minDist = 9999;
        let targetEnemy = null;
        
        // Check enemies for aim assist
        enemies.forEach(e => {
            const screen = toScreenPos(e);
            // Because Canvas is mirrored via CSS, screen.x is visually flipped.
            // Our state.hand.x is already flipped (1-x).
            // So we compare directly.
            const dist = Math.hypot(screen.x - targetX, screen.y - targetY);
            if (dist < CONFIG.MAGNET_RADIUS && dist < minDist) {
                minDist = dist;
                targetEnemy = e;
            }
        });

        let isLocked = false;
        if (targetEnemy) {
            const snap = toScreenPos(targetEnemy);
            targetX = snap.x;
            targetY = snap.y;
            isLocked = true;
        }

        // Lerp Cursor
        cursorX += (targetX - cursorX) * 0.3;
        cursorY += (targetY - cursorY) * 0.3;

        // Update Crosshair (Unproject 2D -> 3D)
        // We need to map 0..width to -1..1
        // Since canvas is scaleX(-1), we invert X logic here for projection?
        // No, Three.js is unaware of CSS transform. We project normally based on Screen Coords.
        // But Screen Coords calculated via 'toScreenPos' were based on standard projection.
        // We just need to map cursorX/Y to Normalized Device Coords (NDC)
        
        const ndcX = (cursorX / window.innerWidth) * 2 - 1;
        const ndcY = -(cursorY / window.innerHeight) * 2 + 1;
        
        const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
        vector.unproject(camera);
        const dir = vector.sub(camera.position).normalize();
        const dist = 4;
        const pos = camera.position.clone().add(dir.multiplyScalar(dist));
        
        crosshair.position.copy(pos);
        crosshair.lookAt(camera.position);
        crosshair.material.color.setHex(isLocked ? 0xff0000 : 0x00ff00);

        // Laser
        const positions = laserLine.geometry.attributes.position.array;
        // Start (Bottom Right of screen roughly, relative to camera)
        const startVec = new THREE.Vector3(0.5, -0.5, 1).unproject(camera); 
        positions[0] = startVec.x; positions[1] = startVec.y; positions[2] = startVec.z;
        // End (Crosshair)
        positions[3] = pos.x; positions[4] = pos.y; positions[5] = pos.z;
        laserLine.geometry.attributes.position.needsUpdate = true;

        // Shoot
        if (state.hand.isShooting && time - state.lastShotTime > 400) {
            state.lastShotTime = time;
            AudioSys.shoot();
            
            if (isLocked && targetEnemy) {
                AudioSys.hit();
                createFloatingText("HIT!", cursorX, cursorY - 40, "#0f0");
                
                // Destroy
                enemyGroup.remove(targetEnemy);
                const idx = enemies.indexOf(targetEnemy);
                if (idx > -1) enemies.splice(idx, 1);
                
                state.score += 100;
                document.getElementById('score-board').innerText = "SCORE: " + state.score;
            } else {
                createFloatingText("MISS", cursorX, cursorY - 40, "#fff");
            }
        }
    }

    renderer.render(scene, camera);
}

// Start Button Logic
document.getElementById('start-btn').addEventListener('click', () => {
    AudioSys.init();
    document.getElementById('loader').style.display = 'none';
    state.isPlaying = true;
    requestAnimationFrame(loop);
});

// Window Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    state.width = window.innerWidth;
    state.height = window.innerHeight;
});

// Boot Sequence
(async () => {
    const camSuccess = await initCamera();
    if (camSuccess) {
        await initAI();
    }
})();

</script>
</body>
</html>
